name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./04-app

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: 04-app/package-lock.json

      - name: Instalar dependencias
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Variable de entorno simple (no es secreta)
        env:
          AMBIENTE: ci
        run: echo "Corriendo en ambiente $AMBIENTE"

      - name: Usar un secreto del repositorio
        env:
          MI_SECRETO: ${{ secrets.MI_SECRETO }}
        run: |
          if [ -z "$MI_SECRETO" ]; then
            echo "MI_SECRETO no está configurado todavía (ver pasos/04-secretos.md)"
          else
            echo "El secreto existe. Su valor nunca se imprime en los logs."
          fi

      - name: Usar el GITHUB_TOKEN automático
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }} \
            | grep '"full_name"'
